<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PureClean</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  background:#111;
  padding:20px;
  text-align:center;
}

h1{
  color:#8cff00;
  margin:0;
}

main{
  padding:16px;
}

.card{
  background:#151515;
  padding:16px;
  border-radius:14px;
  margin-bottom:14px;
}

button{
  width:100%;
  background:#8cff00;
  color:#000;
  border:none;
  padding:15px;
  border-radius:10px;
  font-size:18px;
  margin-top:10px;
}

.secondary{
  background:#333;
  color:white;
}

.danger{
  background:#b00020;
  color:white;
}

input, textarea, select{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin-top:8px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #444;
  background:#222;
  color:white;
  font-size:16px;
}

label{
  display:block;
  margin-top:10px;
  color:#bbb;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.customer{
  background:#1c1c1c;
  padding:14px;
  border-radius:10px;
  margin-bottom:12px;
}
.customer strong{
  color:#8cff00;
}
</style>
</head>

<body>

<header>
  <h1>Steven's Pure Clean Exteriors</h1>
  <p>Pure Results • Clean Exteriors</p>
</header>

<main>

<div id="homeScreen" class="screen active">

  <div class="card">
    <h2>PureClean Dashboard</h2>
    <p>Your window cleaning business app.</p>
  </div>

  <div class="card">
    <h3>Customers</h3>
    <button onclick="showScreen('customersScreen')">
      Open Customers
    </button>
  </div>

  <div class="card">
    <h3>Daily Round</h3>
    <button disabled>Coming Next</button>
  </div>

  <div class="card">
    <h3>Customer Map</h3>
    <button disabled>Coming Next</button>
  </div>

  <div class="card">
    <h3>Invoices & Payments</h3>
    <button disabled>Coming Next</button>
  </div>

</div>


<div id="customersScreen" class="screen">

  <button class="secondary" onclick="showScreen('homeScreen')">
    ← Back to Dashboard
  </button>

  <div class="card">
    <h2>Customers</h2>

    <button onclick="showScreen('addCustomerScreen')">
      + Add Customer
    </button>
  </div>

  <div id="customerList"></div>

</div>


<div id="addCustomerScreen" class="screen">

  <button class="secondary" onclick="showScreen('customersScreen')">
    ← Back to Customers
  </button>

  <div class="card">

    <h2>Add Customer</h2>

    <label>Name</label>
    <input id="name" placeholder="Customer name">

    <label>Address</label>
    <textarea id="address" placeholder="Address"></textarea>

    <label>Postcode</label>
    <input id="postcode" placeholder="Postcode">

    <label>Phone</label>
    <input id="phone" placeholder="Phone number">

    <label>Email</label>
    <input id="email" placeholder="Email">

    <label>Price (£)</label>
    <input id="price" type="number" step="0.01" placeholder="0.00">

    <label>Cleaning Frequency</label>
    <select id="frequency">
      <option value="1">Weekly</option>
      <option value="2">Every 2 weeks</option>
      <option value="4">Every 4 weeks</option>
      <option value="6">Every 6 weeks</option>
      <option value="8">Every 8 weeks</option>
      <option value="10">Every 10 weeks</option>
      <option value="12">Every 12 weeks</option>
    </select>

    <label>Notes</label>
    <textarea id="notes" placeholder="Access notes, gates, dogs, etc."></textarea>

    <button onclick="saveCustomer()">
      Save Customer
    </button>

  </div>

</div>

</main>


<script>

let customers = JSON.parse(localStorage.getItem("purecleanCustomers") || "[]");

function showScreen(id){
  document.querySelectorAll(".screen").forEach(function(screen){
    screen.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  if(id === "customersScreen"){
    renderCustomers();
  }

  window.scrollTo(0,0);
}

function saveCustomer(){

  const customer = {
    id: Date.now(),
    name: document.getElementById("name").value.trim(),
    address: document.getElementById("address").value.trim(),
    postcode: document.getElementById("postcode").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    email: document.getElementById("email").value.trim(),
    price: document.getElementById("price").value,
    frequency: document.getElementById("frequency").value,
    notes: document.getElementById("notes").value.trim()
  };

  if(!customer.name){
    alert("Please enter a customer name.");
    return;
  }

  customers.push(customer);

  localStorage.setItem(
    "purecleanCustomers",
    JSON.stringify(customers)
  );

  clearForm();

  showScreen("customersScreen");
}

function clearForm(){
  document.getElementById("name").value = "";
  document.getElementById("address").value = "";
  document.getElementById("postcode").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("email").value = "";
  document.getElementById("price").value = "";
  document.getElementById("frequency").value = "4";
  document.getElementById("notes").value = "";
}

function deleteCustomer(id){

  if(!confirm("Delete this customer?")){
    return;
  }

  customers = customers.filter(function(customer){
    return customer.id !== id;
  });

  localStorage.setItem(
    "purecleanCustomers",
    JSON.stringify(customers)
  );

  renderCustomers();
}

function renderCustomers(){

  const list = document.getElementById("customerList");

  if(customers.length === 0){
    list.innerHTML =
      '<div class="card"><p>No customers added yet.</p></div>';
    return;
  }

  let html = "";

  customers.forEach(function(customer){

    html += `
      <div class="customer">
        <strong>${escapeHtml(customer.name)}</strong><br><br>

        ${escapeHtml(customer.address)}<br>
        ${escapeHtml(customer.postcode)}<br><br>

        Phone: ${escapeHtml(customer.phone || "-")}<br>
        Email: ${escapeHtml(customer.email || "-")}<br>
        Price: £${escapeHtml(customer
