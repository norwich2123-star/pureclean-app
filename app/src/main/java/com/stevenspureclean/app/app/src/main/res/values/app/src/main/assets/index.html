<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PureClean</title>
<style>
body{
  margin:0;
  background:#070707;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  background:#000;
  padding:18px;
  border-bottom:1px solid #333;
}
h1{
  margin:0;
  color:#9cff00;
  font-size:22px;
}
p{color:#bbb}
main{padding:16px}
.card{
  background:#151515;
  border:1px solid #2d2d2d;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}
button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  background:#9cff00;
  color:#000;
  font-weight:bold;
  font-size:16px;
}
</style>
</head>

<body>

<header>
  <h1>Steven's Pure Clean Exteriors</h1>
  <p>Pure Results • Clean Exteriors</p>
</header>

<main>

<div class="card">
  <h2>PureClean Dashboard</h2>
  <p>Your window cleaning business app is running.</p>
</div>

<div class="card">
  <h3>Customers</h3>
  <button>View Customers</button>
</div>

<div class="card">
  <h3>Daily Round</h3>
  <button>Open Planner</button>
</div>

<div class="card">
  <h3>Customer Map</h3>
  <button>Open Map</button>
</div>

<div class="card">
  <h3>Invoices & Payments</h3>
  <button>Open Money</button>
</div>

</main>

</body>
</html>
