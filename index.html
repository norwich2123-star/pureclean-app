<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PureClean</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--lime:#9cff00;--black:#070707;--panel:#141414;--muted:#999;--line:#292929}*{box-sizing:border-box}body{margin:0;background:var(--black);color:white;font-family:Arial,sans-serif}header{padding:16px;border-bottom:1px solid var(--line);background:#050505;position:sticky;top:0;z-index:10}.brand{font-weight:800;color:var(--lime);font-size:21px}.sub{font-size:12px;color:#bbb}main{padding:14px 14px 90px}.page{display:none}.page.active{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0d0d0d;border-radius:12px;padding:13px}.stat b{display:block;color:var(--lime);font-size:22px}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#0b0b0b;color:#fff;margin:5px 0 9px}.primary{background:var(--lime);border:0;color:#000;font-weight:800;padding:11px 14px;border-radius:10px}.secondary{background:#242424;border:1px solid #3a3a3a;color:#fff;padding:10px 12px;border-radius:10px;text-decoration:none}.item{padding:12px 0;border-bottom:1px solid #2a2a2a}.small{font-size:12px;color:var(--muted)}.money{color:var(--lime);font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}#map{height:58vh;border-radius:12px;overflow:hidden}nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;position:fixed;left:0;right:0;bottom:0;background:#050505;border-top:1px solid var(--line);z-index:20}nav button{background:#111;border:0;color:#bbb;padding:10px 4px;border-radius:10px;font-size:12px}nav button.active{color:#000;background:var(--lime);font-weight:700}
</style></head><body><header><div class="brand">Steven's Pure Clean Exteriors</div><div class="sub">Pure Results • Clean Exteriors</div></header><main>
<section id="home" class="page active"><h2>Dashboard</h2><div class="grid"><div class="stat"><span class="small">Today's jobs</span><b id="statJobs">0</b></div><div class="stat"><span class="small">Today's value</span><b id="statValue">£0</b></div><div class="stat"><span class="small">Customers</span><b id="statCustomers">0</b></div><div class="stat"><span class="small">Outstanding</span><b id="statDebt">£0</b></div></div><div class="card"><h3>Today's round</h3><div id="todayList"></div></div></section>
<section id="planner" class="page"><h2>Planner</h2><div class="card"><input id="plannerDate" type="date"><div id="plannerList"></div></div></section>
<section id="customers" class="page"><h2>Customers</h2><div class="card"><input id="searchCustomer" placeholder="Search customers"><button class="primary" onclick="toggleCustomerForm()">+ Add customer</button></div><div id="customerForm" class="card" style="display:none"><input id="cName" placeholder="Name"><input id="cAddress" placeholder="Address"><input id="cPostcode" placeholder="Postcode"><input id="cPhone" placeholder="Phone"><input id="cEmail" placeholder="Email"><input id="cPrice" type="number" step="0.01" placeholder="Price £"><select id="cFreq"><option value="1">Weekly</option><option value="2">2 weekly</option><option value="4" selected>4 weekly</option><option value="6">6 weekly</option><option value="8">8 weekly</option><option value="12">12 weekly</option></select><input id="cRound" placeholder="Round / area"><textarea id="cNotes" placeholder="Notes / access details"></textarea><button class="primary" onclick="saveCustomer()">Save customer</button></div><div id="customerList" class="card"></div></section>
<section id="mapPage" class="page"><h2>Customer Map</h2><div class="card"><select id="mapRound" onchange="renderMapPins()"><option value="">All rounds</option></select><div id="map"></div></div></section>
<section id="money" class="page"><h2>Money</h2><div class="card"><h3>Invoices & payments</h3><div id="invoiceList"></div></div><div class="card"><h3>Payment settings</h3><input id="payName" placeholder="Account name"><input id="paySort" placeholder="Sort code"><input id="payAccount" placeholder="Account number"><input id="payTerms" value="Payment due within 7 days"><button class="primary" onclick="savePaymentSettings()">Save payment details</button></div><div class="card"><h3>Backup</h3><button class="secondary" onclick="exportBackup()">Export backup</button></div></section>
</main><nav><button data-page="home" class="active">Home</button><button data-page="planner">Planner</button><button data-page="customers">Customers</button><button data-page="mapPage">Map</button><button data-page="money">Money</button></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const KEY='pureclean_db_v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"customers":[],"jobs":[],"invoices":[],"payments":{}}');let map,markers=[];const $=id=>document.getElementById(id);const fmt=n=>'£'+Number(n||0).toFixed(2);const iso=d=>d.toISOString().slice(0,10);const today=()=>iso(new Date());const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}function cby(id){return db.customers.find(c=>c.id===id)||{}}function addWeeks(ds,w){let d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+w*7);return iso(d)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===b.dataset.page));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.page==='mapPage')setTimeout(()=>{initMap();map.invalidateSize();renderMapPins()},120)});
function toggleCustomerForm(){let f=$('customerForm');f.style.display=f.style.display==='none'?'block':'none'}async function geocode(pc){try{let r=await fetch('https://api.postcodes.io/postcodes/'+encodeURIComponent(pc.trim()));let j=await r.json();if(j.status===200)return{lat:j.result.latitude,lng:j.result.longitude}}catch(e){}return null}
async function saveCustomer(){let c={id:uid(),name:$('cName').value.trim(),address:$('cAddress').value.trim(),postcode:$('cPostcode').value.trim(),phone:$('cPhone').value.trim(),email:$('cEmail').value.trim(),price:Number($('cPrice').value||0),freq:Number($('cFreq').value||4),round:$('cRound').value.trim(),notes:$('cNotes').value.trim()};if(!c.name){alert('Enter a name');return}let p=await geocode(c.postcode);if(p)Object.assign(c,p);db.customers.push(c);db.jobs.push({id:uid(),customerId:c.id,date:today(),status:'scheduled'});save();toggleCustomerForm()}
function completeJob(id){let j=db.jobs.find(x=>x.id===id);if(!j)return;j.status='done';let c=cby(j.customerId);let next=addWeeks(j.date,c.freq||4);if(!db.jobs.some(x=>x.customerId===c.id&&x.date===next))db.jobs.push({id:uid(),customerId:c.id,date:next,status:'scheduled'});db.invoices.push({id:uid(),customerId:c.id,date:j.date,amount:c.price,status:'due'});save()}function moveJob(id,days){let j=db.jobs.find(x=>x.id===id);let d=new Date(j.date+'T12:00:00');d.setDate(d.getDate()+days);j.date=iso(d);save()}
function renderDashboard(){let jobs=db.jobs.filter(j=>j.date===today()&&j.status!=='done');$('statJobs').textContent=jobs.length;$('statValue').textContent=fmt(jobs.reduce((s,j)=>s+(cby(j.customerId).price||0),0));$('statCustomers').textContent=db.customers.length;$('statDebt').textContent=fmt(db.invoices.filter(i=>i.status==='due').reduce((s,i)=>s+i.amount,0));$('todayList').innerHTML=jobs.length?jobs.map(j=>{let c=cby(j.customerId);return `<div class="item"><b>${c.name}</b><div class="small">${c.address||''} ${c.postcode||''}</div><div class="row"><button class="primary" onclick="completeJob('${j.id}')">Complete</button>${c.phone?`<a class="secondary" href="sms:${c.phone}">SMS</a>`:''}</div></div>`}).join(''):'<div class="small">No jobs today.</div>'}
function renderPlanner(){let d=$('plannerDate').value||today();$('plannerDate').value=d;let jobs=db.jobs.filter(j=>j.date===d);$('plannerList').innerHTML=jobs.length?jobs.map(j=>{let c=cby(j.customerId);return `<div class="item"><b>${c.name}</b> <span class="money">${fmt(c.price)}</span><div class="row"><button class="secondary" onclick="moveJob('${j.id}',1)">+1 day</button><button class="secondary" onclick="moveJob('${j.id}',7)">+1 week</button>${j.status!=='done'?`<button class="primary" onclick="completeJob('${j.id}')">Complete</button>`:''}</div></div>`}).join(''):'<div class="small">No jobs.</div>'}$('plannerDate').onchange=renderPlanner;
function renderCustomers(){let q=($('searchCustomer').value||'').toLowerCase(),arr=db.customers.filter(c=>[c.name,c.address,c.postcode,c.round].join(' ').toLowerCase().includes(q));$('customerList').innerHTML=arr.length?arr.map(c=>`<div class="item"><b>${c.name}</b> <span class="money">${fmt(c.price)}</span><div class="small">${c.address||''} ${c.postcode||''}</div><div class="small">${c.freq} weekly ${c.round?'• '+c.round:''}</div></div>`).join(''):'<div class="small">No customers yet.</div>'}$('searchCustomer').oninput=renderCustomers;
function initMap(){if(map)return;map=L.map('map').setView([52.63,1.30],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}function renderMapPins(){if(!map)return;markers.forEach(m=>map.removeLayer(m));markers=[];let r=$('mapRound').value,arr=db.customers.filter(c=>c.lat&&c.lng&&(!r||c.round===r));arr.forEach(c=>markers.push(L.marker([c.lat,c.lng]).addTo(map).bindPopup(`<b>${c.name}</b><br>${c.address||''}<br>${c.postcode||''}<br>${fmt(c.price)}`)));if(markers.length)map.fitBounds(L.featureGroup(markers).getBounds().pad(.2))}function renderRounds(){let rs=[...new Set(db.customers.map(c=>c.round).filter(Boolean))].sort();$('mapRound').innerHTML='<option value="">All rounds</option>'+rs.map(r=>`<option>${r}</option>`).join('')}
function renderInvoices(){$('invoiceList').innerHTML=db.invoices.length?db.invoices.slice().reverse().map(i=>{let c=cby(i.customerId);return `<div class="item"><b>${c.name}</b> <span class="money">${fmt(i.amount)}</span><div class="small">${i.date} • ${i.status}</div>${i.status!=='paid'?`<button class="secondary" onclick="i.status='paid';save()">Mark paid</button>`:''}</div>`}).join(''):'<div class="small">No invoices yet.</div>'}function savePaymentSettings(){db.payments={name:$('payName').value,sort:$('paySort').value,account:$('payAccount').value,terms:$('payTerms').value};save();alert('Saved')}function loadPay(){let p=db.payments||{};$('payName').value=p.name||'';$('paySort').value=p.sort||'';$('payAccount').value=p.account||'';$('payTerms').value=p.terms||'Payment due within 7 days'}function exportBackup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pureclean-backup.json';a.click()}function renderAll(){renderDashboard();renderPlanner();renderCustomers();renderRounds();renderInvoices();loadPay();if(map)renderMapPins()}renderAll();
</script></body></html>
